#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

show_downloads: False
google_analytics:

kramdown:
  input: GFM
  syntax_highlighter: rouge
